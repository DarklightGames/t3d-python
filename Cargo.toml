[package]
name = "t3d-python"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name="t3dpy"
crate-type=["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
t3d = "0.1"

[dependencies.pyo3]
version = "0.30.1"
features = ["extension-module", "macros", "abi3-py311", "generate-import-lib"]
